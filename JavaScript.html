<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxXExy1la6O6ZcPYXbRyisijIM9yklie2cz-BKMLj_R9QGAe7UdAbRopLINOi2z4W7M/exec";

  async function goiAPI(action, data = {}) {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, data })
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.message);
    return result.data;
  }

  let matKhauPhien = null; // giữ mật khẩu trong bộ nhớ tạm của phiên làm việc, không lưu lại

  // ====== CHUYỂN TAB ======
  document.querySelectorAll('.tab-nut').forEach(nut => {
    nut.addEventListener('click', () => {
      document.querySelectorAll('.tab-nut').forEach(n => n.classList.remove('dang-chon'));
      document.querySelectorAll('.khung').forEach(k => k.classList.remove('dang-chon'));
      nut.classList.add('dang-chon');
      document.getElementById('khung-' + nut.dataset.tab).classList.add('dang-chon');
    });
  });

  function hienThongBao(idKhung, noiDung, loai) {
    const o = document.getElementById(idKhung);
    o.innerHTML = noiDung ? `<div class="thong-bao ${loai}">${noiDung}</div>` : '';
  }

  // ====== TAB 1: TRA CỨU CÁ NHÂN ======
  document.getElementById('nut-tra-cuu').addEventListener('click', traCuuCaNhan);
  document.getElementById('o-ma-hs').addEventListener('keydown', e => {
    if (e.key === 'Enter') traCuuCaNhan();
  });

  function traCuuCaNhan() {
    const maHS = document.getElementById('o-ma-hs').value.trim();
    if (!maHS) return;

    hienThongBao('thong-bao-ca-nhan', '', '');
    document.getElementById('ket-qua-ca-nhan').innerHTML = 'Đang tra cứu...';
    document.getElementById('nut-tra-cuu').disabled = true;

    goiAPI('getTraCuuCaNhan', { maHS })
      .then(ketQua => {
        document.getElementById('nut-tra-cuu').disabled = false;
        renderTraCuu(ketQua);
      })
      .catch(loi => {
        document.getElementById('nut-tra-cuu').disabled = false;
        document.getElementById('ket-qua-ca-nhan').innerHTML = '';
        hienThongBao('thong-bao-ca-nhan', loi.message, 'loi');
      });
  }

  const TEN_KY = {
    Diem_GK1: 'Giữa kỳ 1', Diem_CK1: 'Cuối kỳ 1',
    Diem_GK2: 'Giữa kỳ 2', Diem_CK2: 'Cuối kỳ 2', Diem_CaNam: 'Cả năm'
  };

  function renderTraCuu(ketQua) {
    const tt = ketQua.thongTin;
    let html = `<div class="the-ket-qua">
      <h3>${tt.hoTen}</h3>
      <div class="ma">Mã học sinh: ${tt.maHS}${tt.ngaySinh ? ' • Ngày sinh: ' + tt.ngaySinh : ''}</div>
    </div>`;

    Object.keys(TEN_KY).forEach(ky => {
      const diem = ketQua.diem[ky];
      if (!diem) return;
      html += `<div class="cuon-bang" style="margin-bottom:14px">
        <table class="bang-diem">
          <tr><th colspan="2">${TEN_KY[ky]}</th></tr>
          ${monHocRows(diem)}
        </table>
      </div>`;
    });

    document.getElementById('ket-qua-ca-nhan').innerHTML = html;
  }

  function monHocRows(diem) {
    const boQua = ['STT', 'Mã học sinh', 'Họ và tên', 'Ngày sinh'];
    return Object.keys(diem)
      .filter(k => !boQua.includes(k) && diem[k] !== '')
      .map(k => `<tr><td>${k}</td><td>${diem[k]}</td></tr>`)
      .join('');
  }

  // ====== TAB 2: XEM THEO LỚP / KỲ ======
  document.getElementById('nut-xem-lop').addEventListener('click', () => {
    const ky = document.getElementById('chon-ky-lop').value;
    hienThongBao('thong-bao-lop', '', '');
    document.getElementById('ket-qua-lop').innerHTML = 'Đang tải...';
    document.getElementById('nut-xem-lop').disabled = true;

    goiAPI('getDanhSachLop', { ky })
      .then(ds => {
        document.getElementById('nut-xem-lop').disabled = false;
        renderDanhSachLop(ds);
      })
      .catch(loi => {
        document.getElementById('nut-xem-lop').disabled = false;
        document.getElementById('ket-qua-lop').innerHTML = '';
        hienThongBao('thong-bao-lop', loi.message, 'loi');
      });
  });

  function renderDanhSachLop(ds) {
    if (!ds.length) {
      document.getElementById('ket-qua-lop').innerHTML = '<p class="ghi-chu">Chưa có dữ liệu cho kỳ này.</p>';
      return;
    }
    const cot = ['STT', 'Mã học sinh', 'Họ và tên', 'Toán học', 'Ngữ văn', 'Kết quả học tập'];
    let html = `<div class="cuon-bang"><table class="bang-diem"><tr>${cot.map(c => `<th>${c}</th>`).join('')}</tr>`;
    ds.forEach(hs => {
      html += `<tr>${cot.map(c => `<td>${hs[c] || ''}</td>`).join('')}</tr>`;
    });
    html += '</table></div>';
    document.getElementById('ket-qua-lop').innerHTML = html;
  }

  // ====== TAB 3: MỞ KHÓA QUẢN TRỊ ======
  document.getElementById('nut-mo-khoa').addEventListener('click', () => {
    const mk = document.getElementById('o-mat-khau').value;
    if (!mk) return;

    hienThongBao('thong-bao-khoa', '', '');
    document.getElementById('nut-mo-khoa').disabled = true;

    goiAPI('verifyPassword', { password: mk })
      .then(() => {
        matKhauPhien = mk;
        document.getElementById('khu-vuc-khoa').classList.add('an');
        document.getElementById('khu-vuc-admin').classList.remove('an');
        document.getElementById('khu-vuc-import').classList.remove('an');
      })
      .catch(loi => {
        document.getElementById('nut-mo-khoa').disabled = false;
        hienThongBao('thong-bao-khoa', loi.message, 'loi');
      });
  });

  // ====== KHỞI TẠO DATABASE ======
  document.getElementById('nut-khoi-tao').addEventListener('click', () => {
    hienThongBao('thong-bao-khoi-tao', '', '');
    document.getElementById('nut-khoi-tao').disabled = true;

    goiAPI('setupDatabase', { password: matKhauPhien })
      .then(msg => {
        document.getElementById('nut-khoi-tao').disabled = false;
        hienThongBao('thong-bao-khoi-tao', msg, 'tot');
      })
      .catch(loi => {
        document.getElementById('nut-khoi-tao').disabled = false;
        hienThongBao('thong-bao-khoi-tao', loi.message, 'loi');
      });
  });

  // ====== NHẬP EXCEL ======
  document.getElementById('nut-nhap-excel').addEventListener('click', () => {
    const ky = document.getElementById('chon-ky-import').value;
    const file = document.getElementById('o-file-excel').files[0];
    if (!file) {
      hienThongBao('thong-bao-import', 'Chọn file Excel trước đã thầy ơi.', 'loi');
      return;
    }

    hienThongBao('thong-bao-import', '', '');
    document.getElementById('nut-nhap-excel').disabled = true;

    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const records = XLSX.utils.sheet_to_json(ws, { defval: '' });

        if (!records.length) {
          document.getElementById('nut-nhap-excel').disabled = false;
          hienThongBao('thong-bao-import', 'File không có dữ liệu.', 'loi');
          return;
        }

        goiAPI('importExcel', { ky, records, password: matKhauPhien })
          .then(soLuong => {
            document.getElementById('nut-nhap-excel').disabled = false;
            hienThongBao('thong-bao-import', `Đã nhập ${soLuong} dòng vào ${TEN_KY[ky]}.`, 'tot');
          })
          .catch(loi => {
            document.getElementById('nut-nhap-excel').disabled = false;
            hienThongBao('thong-bao-import', loi.message, 'loi');
          });

      } catch (err) {
        document.getElementById('nut-nhap-excel').disabled = false;
        hienThongBao('thong-bao-import', 'Không đọc được file: ' + err.message, 'loi');
      }
    };
    reader.readAsArrayBuffer(file);
  });
</script>
